---
RSpecStructure:
  Enabled: true
  Include:
    - "**/*_spec.rb"
    - "**/spec/**/*"

RSpecStructure/AsymmetricContexts:
  Description: >-
    Checks that a `context` describing one branch of an externally
    observable condition has a sibling context for its natural
    counterpart. A lone context with no siblings is always flagged
    mechanically; two or more siblings are judged semantically by Jev
    (see ConditionInExample's "Setting up Jev"), a no-op without
    TYPESAFE_API_KEY.
  Enabled: true
  CheckScope: diff
  DiffBase: auto
  Model: jev-latest
  JevThreshold: 0.7
  JevTimeoutSeconds: 5
  OnJevError: skip
  CacheEnabled: true
  VersionAdded: "<<next>>"

RSpecStructure/ConditionInExample:
  Description: >-
    Checks that example descriptions do not contain a condition that
    belongs in a surrounding `context` block instead.
  Enabled: true
  # diff (default): only judge examples touched by the current git diff.
  # full: judge every example, regardless of what changed.
  CheckScope: diff
  # auto resolves the base ref itself (CI-aware; see README). Set an
  # explicit branch/SHA to skip that resolution.
  DiffBase: auto
  ConditionKeywords:
    - の場合
    - のとき
    - 場合
    - 際
    - when
    - if
    - in case
  Model: jev-latest
  JevThreshold: 0.6
  JevTimeoutSeconds: 5
  # skip (default): ignore TypeSafe API failures. warn: also print a
  # message. raise: let the error propagate and fail the rubocop run.
  OnJevError: skip
  CacheEnabled: true
  VersionAdded: "<<next>>"

RSpecStructure/MultipleExamplesInGroup:
  Description: >-
    Checks that a group block (example group or shared group) does not
    directly nest more than one example.
  Enabled: true
  VersionAdded: "<<next>>"
